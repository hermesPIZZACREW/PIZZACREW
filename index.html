<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZA CREW</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body { 
      background-color: #0d0d0d; 
      color: #fff; 
      font-family: sans-serif; 
      margin: 0; 
      padding: 16px; 
      text-align: center; 
    }
    
    h1 { 
      font-family: 'Montserrat', sans-serif; 
      font-size: 32px; 
      letter-spacing: 2px; 
      margin-top: 10px; 
      margin-bottom: 24px;
      text-transform: uppercase; 
    }

    /* BANNER EVENTO CON ZOOM */
    .banner-evento { 
      width: 100%; 
      height: 200px; 
      background: #121212; 
      border: 1px solid #333; 
      border-radius: 12px; 
      overflow: hidden; 
      margin-bottom: 24px; 
      cursor: pointer; 
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .banner-evento img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      transition: transform 0.4s ease;
    }
    /* Effetto zoom su touch/hover banner */
    .banner-evento:hover img,
    .banner-evento:active img {
      transform: scale(1.06);
    }
    .banner-evento:hover,
    .banner-evento:active {
      border-color: #ff4400;
    }

    /* GRIGLIA MAGLIE CON ZOOM */
    .grid-maglie { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 24px; 
    }
    
    .card-item { 
      background-color: #1a1a1a; 
      border: 1px solid #333; 
      border-radius: 12px; 
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }
    
    .square-item {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background-color: #121212;
      overflow: hidden;
    }
    .square-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    /* Effetto zoom leggero sull'immagine e sollevamento card */
    .card-item:hover,
    .card-item:active {
      transform: translateY(-4px);
      border-color: #ff4400;
      box-shadow: 0 6px 15px rgba(255, 68, 0, 0.2);
    }
    .card-item:hover .square-item img,
    .card-item:active .square-item img {
      transform: scale(1.08);
    }

    .item-title { 
      padding: 10px 4px; 
      font-size: 11px; 
      font-weight: bold; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }

    /* POP-UP FINECATRA INGRANDITA */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
      backdrop-filter: blur(5px);
    }
    .modal-img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.15);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      line-height: 38px;
      text-align: center;
    }

    /* PULSANTE INSTAGRAM */
    .btn-instagram {
      display: block;
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      text-transform: uppercase;
      box-sizing: border-box;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>PIZZA CREW</h1>

  <!-- Banner Evento Cliccabile -->
  <div class="banner-evento" onclick="openModal('https://i.ibb.co/MxnT01C0/banner-jpg.jpg')">
    <img src="https://i.ibb.co/MxnT01C0/banner-jpg.jpg" alt="Locandina Evento">
  </div>

  <!-- Griglia Merch Cliccabile -->
  <div class="grid-maglie">
    
    <div class="card-item" onclick="openModal('https://i.ibb.co/Zpx3CPcg/maglia1-jpg.jpg')">
      <div class="square-item">
        <img src="https://i.ibb.co/Zpx3CPcg/maglia1-jpg.jpg" alt="Maglia 1">
      </div>
      <div class="item-title">PIZZA CREW TEE</div>
    </div>

    <div class="card-item" onclick="openModal('https://i.ibb.co/KZb4MHF/maglia2-jpg.jpg')">
      <div class="square-item">
        <img src="https://i.ibb.co/KZb4MHF/maglia2-jpg.jpg" alt="Maglia 2">
      </div>
      <div class="item-title">DROP #01 // SKATE & BURN</div>
    </div>

  </div>

  <!-- Contatti -->
  <p style="margin-bottom: 10px; color: #888; font-size: 12px; letter-spacing: 1px;">SOCIAL & UPDATES</p>
  <a href="https://instagram.com/pizzacrew" class="btn-instagram" target="_blank">Instagram</a>

  <!-- Pop-up Modal -->
  <div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <img id="modalImg" class="modal-img">
  </div>

  <script>
    function openModal(imgSrc) {
      document.getElementById('modalImg').src = imgSrc;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
