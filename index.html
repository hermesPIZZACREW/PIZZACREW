<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZA CREW</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Font per un titolo impattante -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0d0d0d;
      background-image: 
        radial-gradient(circle at 50% 100%, rgba(255, 68, 0, 0.15), transparent 70%),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%231a0a00" fill-opacity="0.4" d="M0,224L48,213.3C96,203,192,181,288,186.7C384,192,480,224,576,218.7C672,213,768,171,864,165.3C960,160,1056,192,1152,197.3C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
      background-repeat: no-repeat;
      background-position: bottom;
      background-attachment: fixed;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    /* Titolo con animazione di caduta */
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 24px;
      text-transform: uppercase;
      font-weight: 900;
      animation: dropDown 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes dropDown {
      0% {
        opacity: 0;
        transform: translateY(-80px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Banner Evento */
    .banner-evento {
      width: 100%;
      height: 200px;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .banner-evento img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Descrizione Evento */
    .evento-descrizione {
      font-size: 13px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.04);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    /* Griglia 2 Quadrati Merch */
    .grid-maglie {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .card-item {
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .square-item {
      aspect-ratio: 1 / 1;
      width: 100%;
      background-color: #111;
    }
    .square-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .item-title {
      color: #fff;
      font-weight: bold;
      font-size: 11px;
      padding: 8px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    /* Pulsante Instagram */
    .btn-instagram {
      display: block;
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      text-transform: uppercase;
      box-sizing: border-box;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>PIZZA CREW</h1>

  <!-- Locandina Evento -->
  <div class="banner-evento">
    <img src="https://i.ibb.co/MxnT01C0/banner-jpg.jpg" alt="Prossimo Evento">
  </div>

  <!-- Descrizione Evento -->
  <div class="evento-descrizione">
    <div style="color: #ff4400; font-weight: bold; margin-bottom: 6px; letter-spacing: 1px; text-align: center;">⚡️ NEXT EVENT // DJ SET & ART EXHIBITION ⚡️</div>
    <div style="margin-bottom: 4px;">🎨 <strong>Esposizione di quadri</strong> & live audio</div>
    <div style="margin-bottom: 4px;">🕔 Dalle 17:00 alle 23:00</div>
    <div style="margin-bottom: 8px;">📍 <strong>Officine Artistiche</strong> — Via Bernini 2, Trieste</div>
    <div style="font-size: 11px; color: #888; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; margin-top: 6px; text-align: center;">
      INGRESSO LIBERO // SOUND SYSTEM ATTIVO
    </div>
  </div>

  <!-- Anteprima Merch -->
  <div class="grid-maglie">
    
    <!-- Maglia 1 -->
    <div class="card-item">
      <div class="square-item">
        <img src="https://i.ibb.co/Zpx3CPcg/maglia1-jpg.jpg" alt="Official Tee">
      </div>
      <div class="item-title">PIZZA CREW TEE</div>
    </div>

    <!-- Maglia 2 -->
    <div class="card-item">
      <div class="square-item">
        <img src="https://i.ibb.co/KZb4MHF/maglia2-jpg.jpg" alt="Skate and Burn">
      </div>
      <div class="item-title">DROP #01 // SKATE & BURN</div>
    </div>

  </div>

  <!-- Contatti -->
  <p style="margin-bottom: 10px; color: #888; font-size: 12px; letter-spacing: 1px;">SOCIAL & UPDATES</p>
  <a href="https://instagram.com/pizzacrew" class="btn-instagram" target="_blank">Instagram</a>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>

</body>
</html>
