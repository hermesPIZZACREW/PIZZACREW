<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIZZA CREW - V2</title> <!-- Ho cambiato il titolo per vedere se si aggiorna -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; text-align: center; }
    h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; letter-spacing: 2px; margin-top: 10px; text-transform: uppercase; }

    .banner-evento { width: 100%; height: 200px; background: #121212; border: 1px solid #333; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .banner-evento img { width: 100%; height: 100%; object-fit: cover; }

    .grid-maglie { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    
    /* IL TRUCCO PER IL QUADRATO PERFETTO */
    .square-item {
      width: 100%;
      padding-top: 100%; /* Questo forza l'altezza ad essere uguale alla larghezza */
      position: relative;
      background-color: #121212;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
    }
    .square-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-item { background-color: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
    .item-title { padding: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>PIZZA CREW</h1>
  <div class="banner-evento"><img src="https://i.ibb.co/MxnT01C0/banner-jpg.jpg"></div>
  <div class="grid-maglie">
    <div class="card-item">
      <div class="square-item"><img src="https://i.ibb.co/Zpx3CPcg/maglia1-jpg.jpg"></div>
      <div class="item-title">PIZZA CREW TEE</div>
    </div>
    <div class="card-item">
      <div class="square-item"><img src="https://i.ibb.co/KZb4MHF/maglia2-jpg.jpg"></div>
      <div class="item-title">DROP #01 // SKATE & BURN</div>
    </div>
  </div>
</body>
</html>
